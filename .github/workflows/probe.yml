name: Probe unresolved boards (one-off)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -I probe.py probe_targets.json > probe_result.json
      - uses: actions/upload-artifact@v4
        with:
          name: probe-result
          path: probe_result.json
