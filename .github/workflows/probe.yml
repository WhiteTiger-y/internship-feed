name: Probe unresolved boards (one-off)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -I probe.py probe_targets.json data/probe_result.json 2> data/probe_stderr.txt || true
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/probe_result.json data/probe_stderr.txt
          git commit -m "Probe result" || exit 0
          git pull --rebase origin main && git push
