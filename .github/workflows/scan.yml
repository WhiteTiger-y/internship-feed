name: Scan career boards

on:
  schedule:
    - cron: "17 10 * * *"   # daily ~6:17am New York (EDT), before the tracker's 7:50am refresh
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scan
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}   # optional; LinkedIn is skipped without it
        run: python -I scan.py
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Daily scan $(date -u +%Y-%m-%d)"
            git push
          fi
